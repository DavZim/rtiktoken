[package]
name = 'rtiktoken'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'rtiktoken'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = { version = '0.9.0', default-features = false, features = ['result_list'] }
tiktoken-rs = '0.11.0'

[profile.release]
lto = true
codegen-units = 1
opt-level = 'z'
panic = 'abort'
